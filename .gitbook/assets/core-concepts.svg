<svg viewBox="0 0 860 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>XLConnect core concepts</title>
  <desc>An Excel workbook at the bottom hosts a script. The script talks upward to cloud services: Xero, Visma and the SharePoint data lake, and sideways down to local storage on the PC.</desc>

  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7282"/>
    </marker>
  </defs>

  <!-- CLOUD -->
  <g>
    <path d="M 200 175 a 62 62 0 0 1 30 -110 a 80 80 0 0 1 150 -35 a 70 70 0 0 1 125 15 a 60 60 0 0 1 95 45 a 55 55 0 0 1 15 85 z"
          fill="#eef4f8" stroke="#c6d4de" stroke-width="2.5"/>
    <rect x="150" y="120" width="560" height="70" fill="#eef4f8"/>
    <path d="M 150 190 q 0 -55 55 -50 L 655 140 q 60 -8 55 50 z" fill="#eef4f8"/>
    <line x1="152" y1="190" x2="708" y2="190" stroke="#c6d4de" stroke-width="2.5"/>
    <text x="430" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#5b7282">THE CLOUD</text>

    <g transform="translate(250,120)">
      <circle r="34" fill="#13B5EA"/>
      <text y="6" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">xero</text>
    </g>
    <g transform="translate(430,120)">
      <circle r="34" fill="#E0261C"/>
      <text y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">visma</text>
    </g>
    <g transform="translate(610,120)">
      <circle r="34" fill="#036C70"/>
      <g transform="translate(-13,-16)">
        <path d="M0 5 a13 5 0 0 1 26 0 v18 a13 5 0 0 1 -26 0 z" fill="#ffffff"/>
        <path d="M0 5 a13 5 0 0 0 26 0 M0 14 a13 5 0 0 0 26 0" fill="none" stroke="#036C70" stroke-width="2"/>
      </g>
    </g>
    <text x="250" y="178" text-anchor="middle" font-size="12.5" fill="#5b7282">Xero</text>
    <text x="430" y="178" text-anchor="middle" font-size="12.5" fill="#5b7282">Visma</text>
    <text x="610" y="178" text-anchor="middle" font-size="12.5" fill="#5b7282">Data lake (SharePoint)</text>
  </g>

  <!-- ARROWS script to cloud -->
  <g stroke="#5b7282" stroke-width="3" fill="none">
    <line x1="320" y1="325" x2="266" y2="203" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="430" y1="325" x2="430" y2="200" marker-start="url(#head)" marker-end="url(#head)"/>
    <line x1="540" y1="325" x2="594" y2="203" marker-start="url(#head)" marker-end="url(#head)"/>
  </g>
  <text x="452" y="270" font-size="12.5" fill="#5b7282">APIs &amp; data</text>

  <!-- EXCEL WORKBOOK -->
  <g>
    <rect x="130" y="400" width="600" height="185" rx="14" fill="#107C41"/>
    <g transform="translate(170,470)">
      <rect x="22" y="-8" width="66" height="80" rx="6" fill="#ffffff"/>
      <g stroke="#c8d8ce" stroke-width="2">
        <line x1="30" y1="12" x2="80" y2="12"/><line x1="30" y1="32" x2="80" y2="32"/><line x1="30" y1="52" x2="80" y2="52"/>
      </g>
      <rect x="0" y="8" width="52" height="52" rx="8" fill="#0B5B32"/>
      <text x="26" y="45" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">X</text>
    </g>
    <text x="300" y="505" font-size="21" font-weight="700" fill="#ffffff">Excel workbook</text>
    <text x="300" y="532" font-size="13.5" fill="#cfe8d8">Cells, ranges, tables, formulas, charts</text>
  </g>

  <!-- SCRIPT -->
  <g>
    <rect x="270" y="335" width="320" height="130" rx="12" fill="#1F2937" stroke="#ffffff" stroke-width="3"/>
    <text x="430" y="382" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Script</text>
    <text x="430" y="406" text-anchor="middle" font-size="13" fill="#A3E635" font-family="Consolas, monospace">javascript</text>
    <text x="430" y="438" text-anchor="middle" font-size="12.5" fill="#9CA3AF">runs inside Excel, talks to the world</text>
  </g>

  <!-- LOCAL STORAGE -->
  <g>
    <rect x="620" y="470" width="200" height="115" rx="12" fill="#eef4f8" stroke="#c6d4de" stroke-width="2.5"/>
    <g transform="translate(655,495)">
      <rect x="0" y="0" width="56" height="26" rx="6" fill="#5b7282"/>
      <circle cx="46" cy="13" r="4" fill="#A3E635"/>
      <rect x="6" y="8" width="24" height="4" rx="2" fill="#ffffff" opacity="0.7"/>
    </g>
    <text x="720" y="552" text-anchor="middle" font-size="15" font-weight="700" fill="#243642">Local storage</text>
    <text x="720" y="572" text-anchor="middle" font-size="12" fill="#5b7282">files on this PC</text>
  </g>
  <line x1="600" y1="425" x2="688" y2="462" stroke="#5b7282" stroke-width="3" marker-start="url(#head)" marker-end="url(#head)"/>
</svg>
